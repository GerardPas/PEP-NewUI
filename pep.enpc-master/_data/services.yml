# Lignes de services orientées client — source unique pour le méga-menu,
# la grille de la landing et les quatre pages /services/<slug>/.
#
# `prestations` reste court : c'est ce qui s'affiche au survol d'une carte et
# dans le méga-menu. Le détail vit dans `capacites`, `departements` et `etudes`.
# Les études et les chiffres proviennent des plaquettes 028 (assets/).

- title: Transition écologique &amp; durable
  title_plain: Transition écologique et durable
  slug: transition-ecologique
  title_en: Ecological &amp; sustainable transition
  lead_en: >
    Urban, territorial and mobility solutions serving the ecological
    transition.
  intro_en:
    - >
      École des Ponts, under the authority of the French Ministry for the
      Ecological Transition, trains engineers attuned to climate and energy
      challenges. Working with 12 research laboratories, the school develops
      innovative solutions for sustainable cities, mobility and the responsible
      economy.
    - >
      Are you a local authority, a land-use planner, a property developer, a
      network concession holder or a transport operator? Do you need to
      transform your activities to adapt them to climate change, limit their
      impact and meet the requirements of those who commission you? Ponts
      Études Projets supports you on your urban, energy, water and sanitation,
      industrial ecology and mobility projects.
  capacites_en:
    - Analyse a context to define an urban or territorial strategy
    - Carry out a benchmark or a market study
    - Model the economic and environmental impacts of different options
    - Build an action plan with its indicators and recommendations
    - Run simulations and impact studies
    - Conduct a public consultation or a field survey
    - Apply for an innovation call for projects
  departements_en:
    - name: City, Environment and Transport (VET)
      url: http://www.enpc.fr/en/city-environment-transport
      text: >
        VET students are trained alongside the most respected research
        laboratories and practitioners, and work on real commissions for
        landmark institutions and think tanks: the Ministry for the Ecological
        Transition, Paris 2024, The Shift Project, France Stratégie.
  etudes_en:
    - client: For a strategy consulting firm
      title: Data collection and analysis
      etudiants: 10 students
      duree: 5 weeks
      besoin: >
        This sustainable development strategy consultancy was bidding for a
        project management support contract on refuelling needs among logistics
        professionals across the Greater Paris metropolitan area. It called on
        Ponts Études Projets for a data collection and analysis phase, carried
        out with individuals working in the logistics zones concerned.
      objet:
        - Administering questionnaires
        - Analysing the results
    - client: For a French metropolitan authority
      title: Rolling out kerbside recycling
      etudiants: 2 students
      duree: 16 weeks
      besoin: >
        Building an action plan for waste management in public spaces.
      objet:
        - >
          Baseline review: analysis of the situation, meetings with urban
          cleanliness stakeholders, an engineer's critical look at the equipment
          and processes in place
        - >
          Benchmarking of urban recycling rollouts — cost, feasibility within the
          local social and urban landscape, durability of the solutions
        - >
          Action plan: rationale for the choices made, communication and
          awareness recommendations, performance indicators, optimisation of
          human and material resources
      apport: >
        An outside view of the waste management plan, a tailored and
        evidence-based proposal, and advice on optimising the city's resources.
    - client: For a French metropolitan authority
      title: Urban development strategy
      etudiants: 3 students
      duree: 8 weeks
      besoin: >
        Building an urban regeneration strategy to make the city more attractive
        to target populations and businesses.
      apport: >
        An outside view of the city and how it works, and a thorough analysis of
        its development needs, drawing on the expertise of the City, Environment
        and Transport department.
  img_src: img/competences/vet.jpg
  img: vet.jpg
  thumbnail: vet-thumbnail.jpg
  alt: Chantier d'aménagement urbain
  href: /services/transition-ecologique/
  lead: >
    Solutions urbaines, territoriales et de mobilité au service de la
    transition écologique.
  prestations:
    - Faisabilité pour l'industrie et le génie civil
    - Dimensionnement et calcul de structures
    - Études thermiques
    - Études bibliographiques
    - Aménagement du territoire
    - Conception et optimisation de processus
  intro:
    - >
      L'École des Ponts, sous la tutelle du Ministère de la Transition écologique,
      forme des étudiants sensibles aux enjeux climatiques et énergétiques. En
      partenariat avec 12 laboratoires de recherche, elle développe des solutions
      innovantes pour les villes durables, la mobilité et l'économie responsable.
    - >
      Vous êtes une collectivité, un aménageur, un promoteur immobilier, un
      concessionnaire de réseau ou un opérateur de transport&nbsp;? Vous devez
      transformer vos activités pour les adapter au changement climatique, en
      limiter l'impact et répondre aux exigences de vos commanditaires&nbsp;?
      Ponts Études Projets vous accompagne sur vos projets urbains, énergétiques,
      d'eau et d'assainissement, d'écologie industrielle et de mobilité.
  capacites:
    - Analyser un contexte pour définir une stratégie urbaine ou territoriale
    - Réaliser un benchmark ou une étude de marché
    - Modéliser les impacts économiques et environnementaux de différentes options
    - Bâtir un plan d'action, ses indicateurs et ses recommandations
    - Mener des simulations et des études d'impact
    - Conduire une consultation citoyenne ou une enquête de terrain
    - Candidater à un appel à projet innovant
  departements:
    - name: Ville, Environnement et Transport (VET)
      url: http://www.enpc.fr/ville-environnement-transport
      text: >
        Les élèves du département VET sont formés au contact des laboratoires de
        recherche et des praticiens les plus réputés, et sont mis en situation de
        commande réelle pour des institutions et think tanks de référence&nbsp;:
        Ministère de la Transition écologique, Paris 2024, The Shift Project,
        France Stratégie.
  plaquettes:
    - label: Plaquette Transition écologique
      file: Plaquette_VET_028.pdf
  etudes:
    - client: Pour un cabinet de conseil en stratégie
      title: Collecte et analyse de données
      etudiants: 10 étudiants
      duree: 5 semaines
      besoin: >
        Ce cabinet de conseil en stratégie de développement durable participe à un
        appel d'offres d'assistance à maîtrise d'ouvrage relatif à l'étude du besoin
        en avitaillement des professionnels de la logistique pour la métropole du
        Grand Paris. Il fait appel à Ponts Études Projets pour une phase de collecte
        et d'analyse de données auprès d'individus situés sur des zones logistiques
        d'intérêt.
      objet:
        - Passation de questionnaires
        - Analyse des résultats
    - client: Pour un cabinet de conseil en stratégie
      title: Optimisation territoriale
      etudiants: 2 étudiants
      duree: 7 semaines
      besoin: >
        Dans le cadre du même appel d'offres, le cabinet souhaite optimiser la
        répartition des stations d'avitaillement sur le territoire en accord avec
        les données de trafic. Ponts Études Projets développe un système permettant
        d'analyser et de mettre à jour les connaissances sur les emplacements
        actuels.
      objet:
        - Analyse des données existantes
        - Développement du modèle d'optimisation du maillage géographique des stations
    - client: Pour une métropole française
      title: Développement du tri sélectif hors foyers
      etudiants: 2 étudiants
      duree: 16 semaines
      besoin: >
        Mise en place d'un plan d'action de gestion des déchets sur la place publique.
      objet:
        - >
          État des lieux&nbsp;: analyse de la situation, rencontre des acteurs de la
          propreté urbaine, regard critique d'ingénieur sur le matériel et les
          procédés en place
        - >
          Benchmarking du déploiement du tri sélectif urbain — coût, faisabilité dans
          le paysage social et urbain local, durabilité des solutions
        - >
          Plan d'action&nbsp;: justification des choix, recommandations de
          communication et de sensibilisation, indicateurs de performance,
          optimisation des ressources humaines et matérielles
      apport: >
        Un regard extérieur sur le plan de gestion des déchets, une proposition
        personnalisée et argumentée, et des conseils sur l'optimisation des
        ressources de la ville.
      quote: >
        Cette mission a été très enrichissante puisqu'elle m'a permis de découvrir
        de façon concrète ce qu'est une mission de conseil — benchmarking, étude de
        faisabilité, proposition technico-financière — au plus près des besoins d'un
        acteur donné dans des domaines tels que l'aménagement et l'environnement.
      quote_by: Julien Tramoni, VET 2023 en césure
    - client: Pour une métropole française
      title: Stratégie d'aménagement urbain
      etudiants: 3 étudiants
      duree: 8 semaines
      besoin: >
        Mise en place d'une stratégie de valorisation urbaine pour rendre la ville
        plus attractive auprès d'une population et d'entreprises cibles.
      apport: >
        Un regard extérieur sur la ville et ses mécanismes, et une analyse poussée
        de ses besoins d'aménagement grâce à l'expertise du département Ville
        Environnement Transport.
      quote: >
        Les étudiants ont réalisé un travail efficace et ont proposé une vision
        intéressante pour nos villes et nos territoires.
      quote_by: Maire de la commune concernée
    - client: Pour un cabinet de private equity
      title: Modèle d'émission de CO₂
      etudiants: 2 étudiants
      duree: 6 semaines
      besoin: >
        Développer un modèle d'évaluation des émissions en temps réel pour déterminer
        la quantité de CO₂ émise sur une portion d'autoroute située au Portugal.
    - client: Pour un expert en solutions énergétiques
      title: Aménagements énergétiquement plus responsables
      etudiants: 3 étudiants
      duree: 9 semaines
      besoin: >
        Mener une étude approfondie des différents procédés existants visant à
        inciter les entreprises à réaliser des aménagements d'économie d'énergie.
        Pays étudiés&nbsp;: Suède, Belgique, Allemagne, Angleterre, Portugal,
        Pays-Bas et Suisse.
    - client: Pour une région économique majeure
      title: Consultation citoyenne
      etudiants: 11 étudiants
      duree: 5 semaines
      besoin: >
        Dans un contexte de révision du schéma directeur pour y inclure une dimension
        environnementale, la région a fait appel à PEP pour mener une consultation
        citoyenne.
      objet:
        - Assurer une présence pour informer sur le schéma directeur
        - Recueillir de manière proactive les avis et retours des citoyens
      apport: >
        Le dynamisme des étudiants et leur connaissance du sujet ont facilité la
        libération de la parole des populations interrogées.
    - client: Pour un opérateur d'infrastructures de transport
      title: Transit de camions en mer du Nord
      besoin: >
        Déterminer les indicateurs permettant d'estimer en temps réel le nombre de
        camions empruntant la voie maritime en mer du Nord.

- title: Transformation digitale
  title_plain: Transformation digitale
  slug: transformation-digitale
  title_en: Digital transformation
  lead_en: >
    AI, data and flow optimisation serving the performance of your processes.
  intro_en:
    - >
      Innovation guides our work with companies as we support them through their
      digital and industrial transformation. Drawing on the Mathematical and
      Computer Engineering and Industrial Engineering departments, we mobilise
      advanced skills in AI, big data, computer vision and supply chain to
      optimise your processes and improve your agility.
    - >
      An attractive, functional website and software that is easy to pick up both
      change how you handle your day-to-day problems. We work on the technical
      building blocks as much as on the organisation of the flows around them.
  capacites_en:
    - Software and interface development (Java, C++, Fortran…)
    - Design and build of websites and mobile applications
    - Image processing, computer vision and artificial intelligence
    - Building and updating databases (Excel, Access…)
    - Automation and overhaul of business tools
    - Process design and optimisation, supply chain mapping
    - Benchmarks, simulations and market studies
    - Action plans and assessments
  departements_en:
    - name: Mathematical and Computer Engineering (IMI)
      url: http://www.enpc.fr/en/mathematical-and-computer-engineering
      text: >
        The IMI programme is devoted to programming, with outstanding training in
        mathematics and statistics. The school is also home to one of the finest
        computer science laboratories in France, the Imagine laboratory.
    - name: Industrial Engineering (GI)
      url: http://www.enpc.fr/en/industrial-engineering
      text: >
        The Industrial Engineering department trains specialists in supply chain,
        industrial systems organisation and disruptive innovation, supported by
        the d.school, a design thinking institution sponsored by Stanford
        University.
  etudes_en:
    - client: For a French government ministry
      title: Specifications for a data management and storage platform
      etudiants: 2 students
      duree: 10 weeks
      besoin: >
        The Defence and Security Senior Officer's Department runs a monitoring
        and alert centre that receives and processes large volumes of data every
        day, data also handled in parallel by other directorates-general. The
        ministry needed to centralise and rationalise how it is managed.
      objet:
        - Secure data submission and storage
        - Data processing and sorting
        - Analysis and visualisation
        - Data reuse
        - >
          Flexibility, responsiveness and resilience of the platform, whose
          purpose includes improving crisis management processes
    - client: For the City of Paris
      title: Extracting data from scanned identity documents
      etudiants: 3 students
      duree: 17 weeks
      besoin: >
        With more than two million residents, the City of Paris receives a large
        volume of documents every year. It wanted an alternative to manual
        processing, and turned to École des Ponts students for their skills in
        image recognition and processing.
      objet:
        - >
          Development of a prototype website, usable on desktop and smartphone,
          for scanning an identity card or passport
        - Display of the useful information extracted from the scanned document
    - client: For a world leader in cosmetics
      title: Simplifying the product portfolio
      etudiants: 2 students
      duree: 11 weeks
      besoin: >
        The company holds a portfolio of 14,000 references in Europe, a source of
        production and organisational costs and of inertia. The objective was to
        improve three factors: cost, responsiveness and sustainability.
      objet:
        - >
          Map the impacts of simplifying the catalogue within the plant and its
          processes
        - >
          Build a comprehensive, quantified assessment tool for those impacts,
          able to show in real time which references to discontinue
        - Bring a fresh view of the market and tailored solutions
  img_src: img/competences/imi.jpg
  img: imi.jpg
  thumbnail: imi-thumbnail.jpg
  alt: Écran de code et de données
  href: /services/transformation-digitale/
  lead: >
    IA, data et optimisation des flux au service de la performance de vos
    processus.
  prestations:
    - Simulation et conception de produits
    - Développement de logiciels et d'interfaces
    - Conception et réalisation de sites internet
    - Études de marché
    - Bases de données (Excel, Access…)
  intro:
    - >
      L'innovation guide notre engagement auprès des entreprises pour les
      accompagner dans leur transformation digitale et industrielle. Grâce à
      l'expertise des départements d'Ingénierie Mathématique et Informatique et de
      Génie Industriel, nous mobilisons des compétences avancées en IA, Big Data,
      Computer Vision et Supply Chain afin d'optimiser vos processus et d'améliorer
      votre agilité.
    - >
      Un site web attrayant et fonctionnel comme un logiciel simple à prendre en
      main changent la façon dont vous gérez vos problématiques. Nous intervenons
      aussi bien sur la brique technique que sur l'organisation des flux qui
      l'entoure.
  capacites:
    - Développement de logiciels et d'interfaces (Java, C++, Fortran…)
    - Conception et réalisation de sites internet et d'applications mobiles
    - Traitement d'image, computer vision et intelligence artificielle
    - Réalisation et mise à jour de bases de données (Excel, Access…)
    - Automatisation et refonte d'outils métier
    - Conception ou optimisation de process, mapping de supply chain
    - Benchmarks, simulations et études de marché
    - Plans d'actions et évaluations
  departements:
    - name: Ingénierie Mathématique et Informatique (IMI)
      url: http://www.enpc.fr/ingenierie-mathematique-et-informatique
      text: >
        Le cursus IMI est entièrement dédié à l'apprentissage de la programmation,
        avec une formation d'excellence en mathématiques et statistiques. L'École
        abrite par ailleurs l'un des meilleurs laboratoires d'informatique de
        France, le laboratoire Imagine.
    - name: Génie Industriel (GI)
      url: http://www.enpc.fr/genie-industriel
      text: >
        Le département Génie Industriel forme des spécialistes de la supply chain,
        de l'organisation des systèmes industriels et de l'innovation de rupture,
        avec le soutien de la d.school, établissement de Design Thinking sponsorisé
        par l'Université de Stanford.
  plaquettes:
    - label: Plaquette Informatique &amp; Data
      file: Plaquette_IMI_028.pdf
    - label: Plaquette Génie Industriel
      file: Plaquette_GI_028.pdf
  etudes:
    - client: Pour un ministère français
      title: Spécifications d'une plateforme de gestion et de stockage de données
      etudiants: 2 étudiants
      duree: 10 semaines
      besoin: >
        Le Service du Haut Fonctionnaire de Défense et de Sécurité abrite un centre
        de veille et d'alerte qui reçoit et traite quotidiennement une grande
        quantité de données, également traitées en parallèle par d'autres directions
        générales. Le Ministère exprime un besoin de centralisation et de
        rationalisation de la gestion de ces données.
      objet:
        - Dépôt et stockage des données de façon sécurisée
        - Traitement et tri des données
        - Analyse et visualisation
        - Réutilisation des données
        - >
          Flexibilité, réactivité et résilience de la plateforme, qui a notamment
          pour vocation d'améliorer les processus de gestion de crise
    - client: Pour la Mairie de Paris
      title: Extraction de données à partir de scans de pièces d'identité
      etudiants: 3 étudiants
      duree: 17 semaines
      besoin: >
        Avec plus de 2 millions d'habitants, la Mairie de Paris reçoit une quantité
        abondante de documents chaque année. La municipalité souhaite une alternative
        au traitement manuel en faisant appel aux compétences des étudiants des Ponts
        en reconnaissance et traitement de l'image.
      objet:
        - >
          Développement d'un site web prototype, accessible sur poste fixe comme sur
          smartphone, permettant de scanner une carte d'identité ou un passeport
        - Affichage des informations utiles tirées du document scanné
    - client: Pour un leader mondial des produits cosmétiques
      title: Simplification du portefeuille de produits
      etudiants: 2 étudiants
      duree: 11 semaines
      besoin: >
        L'entreprise possède un portefeuille de 14 000 références en Europe, source
        de coûts productifs et organisationnels et d'inertie. L'objectif est
        d'améliorer trois facteurs&nbsp;: les coûts, la réactivité et la durabilité.
      objet:
        - >
          Cartographier les impacts de la simplification du catalogue au sein de
          l'usine et de ses processus
        - >
          Réaliser un outil d'évaluation exhaustive et chiffrée de ces impacts,
          permettant d'évaluer en temps réel quelles références supprimer
        - Apporter un regard nouveau sur le marché et des solutions personnalisées
    - client: Pour un bureau d'études en ingénierie
      title: Optimisation de l'assignation d'appels d'offres
      etudiants: 2 étudiants
      duree: 10 semaines
      besoin: >
        Le client fait de l'assistance à maîtrise d'ouvrage sur des projets
        d'infrastructures et doit passer des appels d'offres de marchés de travaux.
        Avec 95 chantiers en cours et 37 nouveaux, le traitement manuel des réponses
        est lourd et chronophage.
      objet:
        - >
          Développer un programme modélisant l'évaluation des offres comme un système
          d'optimisation sous contrainte
        - >
          Obtenir la combinaison la moins chère d'entreprises capables de réaliser
          les lots
    - client: Pour une coopérative laitière
      title: Intelligence artificielle et maintenance industrielle
      etudiants: 2 étudiants
      duree: 15 semaines
      besoin: >
        Les importants équipements industriels de l'entreprise nécessitent une
        maintenance régulière et coûteuse. Le client souhaite un POC autour de
        l'intelligence artificielle pour optimiser la fréquence des opérations de
        maintenance, sa production et ses coûts.
      objet:
        - >
          Donner une vision claire de ce que l'IA peut améliorer dans la gestion de
          la maintenance industrielle
        - >
          Permettre une prise de décision sur l'opportunité de lancer un projet
          débouchant sur un Proof of Concept
    - client: Pour un leader des produits verriers
      title: Mapping d'une supply chain
      etudiants: 2 étudiants
      duree: 6 semaines
      besoin: >
        Le client souhaite cartographier sa supply chain afin de connaître les
        procédures business et la durée de chacune des étapes de la vie d'un produit,
        entre la prise de commande et la livraison, en distinguant ses deux grandes
        familles de produits.
      objet:
        - Mapping de la supply chain
        - Document expliquant la lecture du mapping
    - client: Pour un opérateur foncier public
      title: Déploiement d'un logiciel de gestion de projets d'aménagement
      etudiants: 2 étudiants
      duree: 4 semaines
      besoin: >
        Intégrer Gesprojet, logiciel de gestion de projets d'aménagement, aux
        processus internes du client.
      objet:
        - Intégrer les données existantes dans le logiciel
        - >
          Finaliser son déploiement en assurant son efficacité et sa bonne prise en
          main par les utilisateurs
    - client: Pour une banque privée
      title: Mise à jour des systèmes informatiques
      etudiants: 1 étudiant
      duree: 4 semaines
      besoin: >
        La banque souhaite améliorer ses outils informatiques, actuellement très peu
        automatisés.
      objet:
        - Automatiser le modèle de plan d'activité grâce à des macros et formules Excel
        - Simplifier au maximum son utilisation
    - client: Pour la chaire d'une grande école d'ingénieurs
      title: Questionnaire miroir et analyse
      etudiants: 2 étudiants
      duree: 5 semaines
      besoin: >
        La chaire Supply Chain cherche à analyser la perception et les attentes des
        étudiants autour des métiers de la supply chain, puis à confronter ces
        résultats au vécu des professionnels des quatre partenaires industriels de la
        chaire.
      objet:
        - Double questionnaire en ligne
        - Synthèse des analyses des réponses

- title: Stratégie &amp; Aide à la décision
  title_plain: Stratégie et Aide à la décision
  slug: strategie-decision
  title_en: Strategy &amp; decision support
  lead_en: >
    Economics, finance and data analysis to inform your decisions.
  intro_en:
    - >
      The school has always trained experts in finance, economics and
      management. Recognised notably through the Paris School of Economics and
      Jean Tirole (2014 Nobel laureate), it offers well-established expertise in
      business planning, market studies, strategy consulting and economic
      analysis.
    - >
      Its international outlook — 15 languages spoken and 40% international
      students — allows it to offer its services, technical translation
      included, in a wide range of languages.
  capacites_en:
    - Data analysis and econometrics
    - Highly technical market studies
    - Business plan development
    - Resource management and optimisation
    - Benchmarking and strategy consulting
    - Opinion gathering, field surveys and territorial mapping
    - Technical translation in more than 15 languages
  departements_en:
    - name: Economics, Management and Finance (SEGF)
      url: http://www.enpc.fr/en/economics-management-and-finance
      text: >
        The SEGF department trains engineer-managers able to combine engineering
        science, economics and finance to create and manage complex projects:
        project financing, risk management, economics and econometrics within
        public institutions, research centres and strategy departments.
    - name: Languages and Cultures
      url: http://www.enpc.fr/en/languages-and-cultures
      text: >
        Every École des Ponts student takes at least two foreign languages and
        spends a semester abroad. Our engineering training guarantees a sound
        grasp of technical terms and faithful translation.
  etudes_en:
    - client: For a territorial public authority
      title: Strategy development and opinion gathering
      etudiants: 61 students
      duree: 32 weeks
      besoin: >
        As part of its action plan, the authority wanted to build public
        wastewater networks in streets that had none, in order to reduce
        discharges into the neighbouring river and clean it up. It called on PEP
        to inform and engage residents of the streets concerned.
      objet:
        - >
          Analyse the technical, environmental and political situation of
          wastewater treatment on private property
        - Develop a sound strategy and a compelling message for residents
        - Meet residents through door-to-door questionnaires
        - Summarise and analyse the opinions gathered
    - client: For an inter-municipal urban authority
      title: Mapping the retail offer
      etudiants: 3 students
      duree: 8 weeks
      besoin: >
        The metropolitan authority wanted to map its retail offer with a view to
        further development.
      objet:
        - >
          Map the existing offer, highlighting the categories of retail that are
          missing
        - >
          Engage with the metropolitan area's stakeholders — residents, small
          retailers, elected officials, retail association chairs
        - >
          Take stock of the measures adopted by three metropolitan areas that are
          further ahead on retail policy
    - client: For a renewable energy solutions designer
      title: Benchmark and strategy consulting
      etudiants: 3 students
      duree: 8 weeks
      besoin: >
        Against a backdrop of energy crisis, the company offers solutions such as
        wind turbines to people living in harsh climates, to support water and
        energy independence in those regions. The client wanted an outside view
        and a fresh perspective on its new turbine.
      objet:
        - >
          Hold a discussion on how the turbine could be improved with the
          company's experts
        - >
          Present a detailed report: how it works, technical advantages and
          drawbacks, development history, areas for improvement and innovative
          solutions
