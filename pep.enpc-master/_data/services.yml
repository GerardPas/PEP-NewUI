  prestations:
    - Faisabilité de projets
    - Dimensionnement et calcul de structures
    - Études thermiques
    - Études de coûts-matières
  intro:
    - >
      Les départements de Génie Civil &amp; Construction et de Génie Mécanique &amp;
      Matériaux incarnent l'excellence technique de l'École des Ponts. Le premier
      forme des experts en gestion de projet, organisation de chantier, conception et
      innovation. Le second prépare des ingénieurs capables de maîtriser les outils
      de la mécanique tout en intégrant les enjeux actuels.
    - >
      Ensemble, ils offrent les compétences clés pour accompagner la transformation
      des infrastructures et des processus industriels — du calcul de structure à la
      vérification normative, jusqu'à la fabrication et aux essais.
  capacites:
    - Faisabilité pour l'industrie et le génie civil
    - 'Ingénierie&nbsp;: dimensionnement et calcul de structures'
    - Études thermiques et simulations
    - Études de coûts-matières
    - Synthèse normative et rédaction de notices techniques
    - Études bibliographiques et réglementaires
    - Conception, fabrication et essais de calibration
  departements:
    - name: Génie Civil et Construction (GCC)
      url: http://www.enpc.fr/genie-civil-et-construction
      text: >
        Pilier traditionnel de l'École des Ponts, le département forme les étudiants
        à la gestion de projets, à l'organisation de chantiers, à la conception et au
        développement de nouvelles techniques. Il entretient des liens étroits avec
        trois laboratoires de recherche&nbsp;: le laboratoire Navier, l'IFSTTAR-UGE
        et le laboratoire GSA de l'École d'Architecture de Paris-Malaquais.
    - name: Génie Mécanique et Matériaux (GMM)
      url: http://www.enpc.fr/genie-mecanique-et-materiaux
      text: >
        Le département ambitionne de former des ingénieurs-chercheurs et
        ingénieurs-concepteurs capables de maîtriser les concepts et outils de la
        mécanique, de mener à bien des projets, et conscients des défis de la
        transition écologique et de la réindustrialisation.
  plaquettes:
    - label: Plaquette Génie civil &amp; mécanique
      file: Plaquette_GCC_GMM_028.pdf
  etudes:
    - client: Pour un bureau d'études en ingénierie
      title: Amélioration d'un outil d'aide à la simulation CFD
      etudiants: 2 étudiants
      duree: 5 semaines
      besoin: >
        FDS est un logiciel de simulation dynamique d'incendies. Le client souhaite
        des notices et outils de formation afin que ses équipes puissent l'exploiter
        de manière totalement indépendante, et former ensuite ses employés.
      objet:
        - >
          Développer une version annotée et commentée de l'outil Grasshopper de
          génération automatique de fichier FDS, traitant la décomposition en
          maillages des intersections et des faces exposées pour des calculs Qarnot
        - Élaborer les supports d'un atelier de formation traitant l'exemple d'un essai
    - client: Pour une fédération sportive nationale
      title: Dimensionnement d'un capteur de force
      etudiants: 2 étudiants
      duree: 8 semaines
      besoin: >
        Dans le cadre de l'amélioration de la préparation physique de ses athlètes,
        le client a contacté PEP afin de concevoir une cible de frappe intégrant des
        capteurs mesurant la force, la vitesse et la puissance des coups reçus.
      objet:
        - >
          Analyser l'ordre de grandeur des forces en jeu et choisir les matériaux et
          capteurs
        - Effectuer les calculs de dimensionnement nécessaires
        - Fabriquer le capteur et réaliser les essais de calibration
    - client: Pour une startup innovante du BTP
      title: Notice pour un projet d'échafaudage
      etudiants: 1 étudiant
      duree: 8 semaines
      besoin: >
        Le client propose une idée innovante de colonnes d'échafaudages rétractables.
        Il souhaite une notice d'utilisation pour différents cas d'usage, une
        représentation détaillée des éléments de la structure, une révision des
        calculs mécaniques menés par un bureau d'études et une vérification du
        respect des normes.
      objet:
        - Reprendre les calculs du bureau d'études avec une nouvelle aire d'échafaudage
        - >
          Conception informatique en «&nbsp;vue d'artiste&nbsp;» des divers éléments
          d'ajout de l'échafaudage
        - Conception de la notice
    - client: Pour une entreprise de bâtiment
      title: Recyclage et revalorisation des déchets du BTP
      etudiants: 4 étudiants
      duree: 9 semaines
      besoin: >
        Pour améliorer la gestion des déchets issus de son activité, le client
        souhaite établir une infographie sur le recyclage et la revalorisation des
        déchets du BTP.
      objet:
        - >
          Rédaction d'une bibliographie détaillée sur la réglementation en vigueur,
          les pratiques de chantier, les propositions d'entreprises et les limitations
          liées aux assurances
        - Rédaction de l'infographie et proposition des meilleures options au client
    - client: Pour un spécialiste des aménagements métalliques
      title: 'Étude de structure : plancher en verre'
      etudiants: 1 étudiant
      duree: 2 semaines
      besoin: >
        Le client souhaite réaliser un plancher en verre pour l'un de ses clients et a
        besoin de connaître les normes en vigueur pour une telle structure.
      objet:
        - Synthétiser les normes Eurocodes applicables au dimensionnement
        - >
          Produire un document guide de référence, réutilisable par le client pour de
          futurs projets
        - >
          Effectuer le dimensionnement du plancher selon les Eurocodes et les
          matériaux utilisés par le client
