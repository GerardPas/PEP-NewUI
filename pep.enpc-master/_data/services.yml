- title: Génie Mécanique &amp; Construction
  title_plain: Génie Mécanique et Construction
  slug: genie-mecanique-construction
  title_en: Mechanical engineering &amp; construction
  lead_en: >
    The technical excellence of École des Ponts serving your structures and
    your processes.
  intro_en:
    - >
      The Civil Engineering &amp; Construction and Mechanical Engineering &amp;
      Materials departments embody the technical excellence of École des Ponts.
      The first trains experts in project management, site organisation, design
      and innovation. The second prepares engineers to master the tools of
      mechanics while addressing today's challenges.
    - >
      Together they offer the key skills to support the transformation of
      infrastructure and industrial processes — from structural calculation to
      compliance checking, through to manufacturing and testing.
  capacites_en:
    - Feasibility studies for industry and civil engineering
    - 'Engineering: structural sizing and calculation'
    - Thermal studies and simulations
    - Material cost studies
    - Standards reviews and technical documentation
    - Literature and regulatory reviews
    - Design, manufacturing and calibration testing
  departements_en:
    - name: Civil Engineering and Construction (GCC)
      url: http://www.enpc.fr/en/civil-engineering-and-construction
      text: >
        A traditional pillar of École des Ponts, the department trains students
        in project management, site organisation, design and the development of
        new techniques. It works closely with three research laboratories: the
        Navier laboratory, IFSTTAR-UGE and the GSA laboratory of the
        Paris-Malaquais School of Architecture.
    - name: Mechanical Engineering and Materials (GMM)
      url: http://www.enpc.fr/en/mechanical-engineering-and-materials
      text: >
        The department sets out to train research and design engineers able to
        master the concepts and tools of mechanics, to see projects through, and
        aware of the challenges of the ecological transition and
        reindustrialisation.
  etudes_en:
    - client: For an engineering consultancy
      title: Improving a CFD simulation support tool
      etudiants: 2 students
      duree: 5 weeks
      besoin: >
        FDS is a fire dynamics simulation package. The client wanted
        documentation and training material so that its teams could use it
        entirely independently, and then train its own staff.
      objet:
        - >
          Develop an annotated, commented version of the Grasshopper tool that
          generates FDS files, handling mesh decomposition of intersections and
          exposed faces for Qarnot computations
        - Produce the materials for a training workshop working through one test case
    - client: For a national sports federation
      title: Sizing a force sensor
      etudiants: 2 students
      duree: 8 weeks
      besoin: >
        As part of improving its athletes' physical preparation, the client asked
        PEP to design a strike target with sensors measuring the force, speed and
        power of the blows received.
      objet:
        - Analyse the order of magnitude of the forces involved and select materials and sensors
        - Carry out the necessary sizing calculations
        - Build the sensor and run calibration tests
    - client: For a specialist in metal fittings
      title: 'Structural study: a glass floor'
      etudiants: 1 student
      duree: 2 weeks
      besoin: >
        The client wanted to build a glass floor for one of its own customers and
        needed to know the standards applicable to such a structure.
      objet:
        - Summarise the Eurocode standards applicable to the sizing
        - Produce a reference guide the client can reuse for future projects
        - Size the floor according to the Eurocodes and the materials the client uses
