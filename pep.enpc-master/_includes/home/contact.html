<section id="contact" class="pep-cta">
    <div class="container">
        <div class="pep-cta-inner">
            <h2 class="section-heading pep-cta-title">Un projet en tête&nbsp;?</h2>
            <p class="pep-cta-say">
                Décrivez-nous votre besoin&nbsp;: nous revenons vers vous avec une démarche
                de résolution et un devis.
            </p>
            <div class="pep-cta-actions">
                <a href="{{ site.baseurl }}/contact/" class="pep-btn pep-btn-solid">Demander un devis</a>
                <a href="mailto:{{ site.email }}" class="pep-btn pep-btn-ghost pep-btn-mail">{{ site.email }}</a>
            </div>
        </div>
    </div>
</section>
